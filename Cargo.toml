[package]
name = "maia"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[dependencies]
# egui draws its text with it already; fonts previewed in the inspector use the same.
ab_glyph = "=0.2.32"
dirs = "7.0.0"
fdeflate = "=0.3.7"
egui = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false }
egui_glow = { version = "=0.37.0", default-features = false, features = ["winit"] }
gif = "=0.13.3"
glutin = { version = "0.32.3", default-features = false }
glutin-winit = { version = "0.5.0", default-features = false }
image-webp = "0.2.4"
libc = "0.2.190"
png = "=0.17.16"
regex-lite = "0.1.9"
saphyr-parser = "=0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Parses what programs write to the terminal pane (alacritty's parser).
vte = { version = "0.15.0", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
zune-jpeg = "=0.4.21"
unicode-bidi = "0.3.18"
flate2 = "1"

# Linux desktop backends: Wayland and X11 windows, GL through EGL/GLX, clipboard.
[target.'cfg(target_os = "linux")'.dependencies]
egui-winit = { version = "=0.37.0", default-features = false, features = ["wayland", "x11"] }
egui_glow = { version = "=0.37.0", default-features = false, features = ["winit", "wayland", "x11"] }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
sctk = { version = "=0.19.2", package = "smithay-client-toolkit", default-features = false, features = ["calloop"] }
# The X11 clipboard and drag out, on the same libxcb and libX11 bindings winit uses.
x11-dl = "2.21.0"
x11rb = { version = "0.13.2", default-features = false, features = ["allow-unsafe-code", "dl-libxcb"] }

# Windows: GL through WGL.
[target.'cfg(windows)'.dependencies]
# Zip read and written in the app itself (Windows has no bsdtar; its tar.exe mangles
# names outside the system's code page).
zip = { version = "=9.7.3", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
glutin = { version = "0.32.3", default-features = false, features = ["wgl"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["wgl"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_JobObjects"] }

[features]
# Test-only input driver (see src/testkit.rs).
testkit = []
# Screen readers (AT-SPI through AccessKit). About 1.3 MB more: its D-Bus stack.
screen-reader = ["egui-winit/accesskit"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.bloat]
inherits = "release"
strip = false
debug = false

# User simulations (tools/sim.sh): optimized like a release build so frame timings
# mean something, but quick to build and with overflow checks on.
[profile.sim]
inherits = "dev"
opt-level = 3
overflow-checks = true
debug = 1

# vello_cpu with what egui never asks of it compiled out (see vendor/vello_cpu/Cargo.toml).
[patch.crates-io]
vello_cpu = { path = "vendor/vello_cpu" }
